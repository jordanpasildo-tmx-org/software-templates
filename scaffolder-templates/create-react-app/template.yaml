apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: create-react-app-template
  title: React Web Application (OpenShift Sandbox)
  description: Scaffold a React single-page frontend application with TypeScript, containerized with Red Hat UBI 9 Nginx, and deployed automatically to OpenShift Sandbox via GitHub Actions.
  tags:
    - react
    - typescript
    - frontend
    - openshift
spec:
  owner: group:default/redhat-developer-demos
  type: website

  parameters:
    - title: Application Metadata
      required:
        - component_id
        - owner
      properties:
        component_id:
          title: Application Name
          type: string
          description: Unique name of the frontend application (e.g. trading-dashboard)
          ui:field: EntityNamePicker
          ui:autofocus: true
          pattern: '^[a-z0-9-]+$'
        description:
          title: Description
          type: string
          description: Summary of the application purpose
          default: React TypeScript frontend web application
        owner:
          title: Owning Team
          type: string
          description: Team responsible for maintaining this application
          ui:field: OwnerPicker
          ui:options:
            allowedKinds:
              - Group
              - User

    - title: Destination Repository
      required:
        - repoUrl
      properties:
        repoUrl:
          title: GitHub Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  steps:
    - id: template
      name: Render Application Skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          destination: ${{ parameters.repoUrl | parseRepoUrl }}
          owner: ${{ parameters.owner }}

    - id: publish
      name: Publish to GitHub
      action: publish:github
      input:
        description: ${{ parameters.description }}
        repoUrl: ${{ parameters.repoUrl }}
        defaultBranch: main
        repoVisibility: public

    - id: register
      name: Register in Software Catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: "/catalog-info.yaml"

  output:
    links:
      - title: Source Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
