apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${{ values.component_id }}-pipeline
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    app.kubernetes.io/part-of: tmx-platform
    pipeline.openshift.io/type: build-and-deploy
spec:
  description: >-
    OpenShift DevSecOps pipeline for ${{ values.component_id }} enforcing
    Syft SBOM generation and Trivy CVE scanning.
  params:
    - name: git-url
      type: string
      default: "https://github.com/${{ values.destination.owner }}/${{ values.component_id }}.git"
      description: "Git repository clone URL"
    - name: git-revision
      type: string
      default: "main"
      description: "Git revision (branch, tag, or commit) to checkout"
    - name: base-image
      type: string
      default: "registry.access.redhat.com/ubi9/ubi-minimal:9.4"
      description: "Base container image to scan for CVEs"
  workspaces:
    - name: shared-workspace
      description: "Shared workspace storing cloned source, build artifacts, and security metadata"

  tasks:
    # --------------------------------------------------------------------------
    # Task 1: Fetch Source Repository
    # Clones application source code, Dockerfile, and manifests into workspace
    # --------------------------------------------------------------------------
    - name: fetch-repository
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: output
        steps:
          - name: clone
            image: alpine/git:latest
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Cloning repository $(params.url) (revision: $(params.revision))..."
              rm -rf $(workspaces.output.path)/source
              git clone $(params.url) $(workspaces.output.path)/source
              cd $(workspaces.output.path)/source
              git checkout $(params.revision)
              echo "==> Successfully checked out commit $(git rev-parse HEAD)"

    # --------------------------------------------------------------------------
    # Task 2: SBOM Generation (Syft)
    # Extracts machine-readable CycloneDX Software Bill of Materials (SBOM)
    # --------------------------------------------------------------------------
    - name: generate-sbom
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-workspace
      taskSpec:
        workspaces:
          - name: source
        steps:
          - name: generate-cyclonedx
            image: anchore/syft:v1.16.0
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Generating CycloneDX SBOM with Syft from source dependencies..."
              syft dir:source/src -o cyclonedx-json=sbom.cdx.json
              echo "==> CycloneDX SBOM successfully written to sbom.cdx.json."

    # --------------------------------------------------------------------------
    # Task 3: Vulnerability Scanning (Trivy)
    # Scans container base image & SBOM against CVE databases (fails on CRITICAL)
    # --------------------------------------------------------------------------
    - name: scan-vulnerabilities
      runAfter:
        - generate-sbom
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: base-image
          value: $(params.base-image)
      taskSpec:
        params:
          - name: base-image
            type: string
        workspaces:
          - name: source
        stepTemplate:
          env:
            - name: TRIVY_CACHE_DIR
              value: $(workspaces.source.path)/.trivy-cache
        steps:
          - name: scan-cves
            image: aquasec/trivy:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Inspecting sbom.cdx.json for CVE vulnerabilities with Trivy..."
              TRIVY_IGNORE_ARG=""
              if [ -f "source/.trivyignore" ]; then
                TRIVY_IGNORE_ARG="--ignorefile source/.trivyignore"
              fi

              # Scan application dependencies via CycloneDX SBOM
              trivy sbom \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                $TRIVY_IGNORE_ARG \
                sbom.cdx.json

              # Scan base container image
              echo "==> Scanning base container image $(params.base-image) for known CVEs..."
              trivy image \
                --severity CRITICAL \
                --ignore-unfixed \
                "$(params.base-image)"

              echo "==> Trivy vulnerability scans completed successfully."
