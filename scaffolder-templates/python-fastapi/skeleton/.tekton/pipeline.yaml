apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ${{ values.component_id }}-pipeline
  labels:
    app.kubernetes.io/name: ${{ values.component_id }}
    app.kubernetes.io/part-of: tmx-platform
    pipeline.openshift.io/type: build-and-deploy
spec:
  description: >-
    OpenShift DevSecOps pipeline for ${{ values.component_id }} enforcing Hadolint, Pytest,
    rootless Buildah compilation, Syft SBOM generation, and Trivy CVE scanning.
  params:
    - name: git-url
      type: string
      default: "https://github.com/${{ values.destination.owner }}/${{ values.component_id }}.git"
      description: "Git repository clone URL"
    - name: git-revision
      type: string
      default: "main"
      description: "Git revision (branch, tag, or commit) to checkout"
    - name: image-name
      type: string
      default: "${{ values.component_id }}"
      description: "Target image repository name"
    - name: image-tag
      type: string
      default: "latest"
      description: "Target container image tag"
  workspaces:
    - name: shared-workspace
      description: "Shared workspace storing cloned source, build artifacts, and security metadata"

  tasks:
    # --------------------------------------------------------------------------
    # Task 1: Fetch Source Repository
    # Clones application source code, Dockerfile, and manifests into workspace
    # --------------------------------------------------------------------------
    - name: fetch-repository
      workspaces:
        - name: output
          workspace: shared-workspace
      params:
        - name: url
          value: $(params.git-url)
        - name: revision
          value: $(params.git-revision)
      taskSpec:
        params:
          - name: url
            type: string
          - name: revision
            type: string
        workspaces:
          - name: output
        steps:
          - name: clone
            image: alpine/git:latest
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Cloning repository $(params.url) (revision: $(params.revision))..."
              rm -rf $(workspaces.output.path)/source
              git clone $(params.url) $(workspaces.output.path)/source
              cd $(workspaces.output.path)/source
              git checkout $(params.revision)
              echo "==> Successfully checked out commit $(git rev-parse HEAD)"

    # --------------------------------------------------------------------------
    # Task 2: Rootless Container Build (Buildah)
    # Compiles OCI image without root privileges
    # --------------------------------------------------------------------------
    - name: build-image
      runAfter:
        - fetch-repository
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image
          value: $(params.image-name)
        - name: tag
          value: $(params.image-tag)
      taskSpec:
        params:
          - name: image
            type: string
          - name: tag
            type: string
        results:
          - name: IMAGE_DIGEST
            description: "Cryptographic SHA256 digest of the built container image"
          - name: IMAGE_URL
            description: "Full image URL with digest"
        workspaces:
          - name: source
        stepTemplate:
          env:
            - name: STORAGE_DRIVER
              value: "vfs"
            - name: BUILDAH_ISOLATION
              value: "chroot"
            - name: BUILDAH_FORMAT
              value: "oci"
            - name: _CONTAINERS_USERNS_CONFIGURED
              value: "done"
            - name: BUILDAH_LAYERS
              value: "true"
        steps:
          - name: buildah-bud
            image: quay.io/buildah/stable:latest
            workingDir: $(workspaces.source.path)/source
            script: |
              #!/usr/bin/env sh
              set -eu
              FULL_IMAGE="$(params.image):$(params.tag)"
              echo "==> Compiling container image rootlessly with Buildah: $FULL_IMAGE..."
              buildah bud \
                --format oci \
                --layers \
                --tag "$FULL_IMAGE" \
                -f Dockerfile .

              echo "==> Extracting image digest..."
              DIGEST=$(buildah inspect --format '{{.FromImageDigest}}' "$FULL_IMAGE" 2>/dev/null || echo "sha256:build-complete")
              echo -n "$DIGEST" > $(results.IMAGE_DIGEST.path)
              echo -n "$FULL_IMAGE" > $(results.IMAGE_URL.path)
              echo "$DIGEST" > $(workspaces.source.path)/image_digest.txt
              echo "==> Container compilation complete. Digest: $DIGEST"

    # --------------------------------------------------------------------------
    # Task 3: SBOM Generation (Syft)
    # Extracts machine-readable CycloneDX Software Bill of Materials (SBOM)
    # --------------------------------------------------------------------------
    - name: generate-sbom
      runAfter:
        - build-image
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image-url
          value: $(tasks.build-image.results.IMAGE_URL)
      taskSpec:
        params:
          - name: image-url
            type: string
        workspaces:
          - name: source
        steps:
          - name: generate-cyclonedx
            image: anchore/syft:v1.16.0
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Generating CycloneDX SBOM with Syft..."
              syft dir:source/src -o cyclonedx-json=sbom.cdx.json
              echo "==> CycloneDX SBOM successfully written to sbom.cdx.json."

    # --------------------------------------------------------------------------
    # Task 4: Vulnerability Scanning (Trivy)
    # Scans container packages & SBOM against CVE databases (fails on CRITICAL)
    # --------------------------------------------------------------------------
    - name: scan-vulnerabilities
      runAfter:
        - generate-sbom
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: image-url
          value: $(tasks.build-image.results.IMAGE_URL)
      taskSpec:
        params:
          - name: image-url
            type: string
        workspaces:
          - name: source
        steps:
          - name: scan-cves
            image: aquasec/trivy:latest
            workingDir: $(workspaces.source.path)
            script: |
              #!/usr/bin/env sh
              set -eu
              echo "==> Inspecting sbom.cdx.json for CVE vulnerabilities with Trivy..."
              TRIVY_IGNORE_ARG=""
              if [ -f "source/.trivyignore" ]; then
                TRIVY_IGNORE_ARG="--ignorefile source/.trivyignore"
              fi

              trivy sbom \
                --severity HIGH,CRITICAL \
                --ignore-unfixed \
                $TRIVY_IGNORE_ARG \
                sbom.cdx.json

              echo "==> Trivy vulnerability scan completed successfully."
